<h3>Venta de Productos</h3>
<a routerLink="/" class="btn btn-secondary mb-3">Volver al Inicio</a>

<form [formGroup]="form" (ngSubmit)="registrarVenta()" class="row g-3 mb-3">
	<div class="col-md-4">
		<label>Cliente</label>
		<select formControlName="clienteId" class="form-select" (change)="onProductoChange()">
			<option [ngValue]="null">-- Seleccione cliente --</option>
			<option *ngFor="let c of clientes" [value]="c.id">{{c.nombre}}</option>
		</select>
	</div>

	<div class="col-md-4">
		<label>Producto</label>
		<select formControlName="productoId" class="form-select" (change)="onProductoChange()">
			<option [ngValue]="null">-- Seleccione producto --</option>
			<option *ngFor="let p of productos" [value]="p.id">{{p.nombre}} - S/. {{p.precio}}</option>
		</select>
	</div>

	<div class="col-md-2">
		<label>Cantidad</label>
		<input type="number" formControlName="cantidad" class="form-control" min="1" />
	</div>

	<div class="col-md-2 d-flex align-items-end">
		<button class="btn btn-primary" type="submit">Vender</button>
	</div>
</form>

<h4>Ventas Registradas</h4>
<ul class="list-group">
	<li *ngFor="let v of ventas" class="list-group-item">
		Cliente: {{ getClienteNombre(v.clienteId) }} — Producto: {{ getProductoNombre(v.productoId) }} — Cant: {{v.cantidad}} — Total: S/. {{v.total}}
	</li>
</ul>
