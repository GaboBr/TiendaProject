<h3>Registro de Clientes</h3>
<a routerLink="/" class="btn btn-secondary mb-3">Volver al Inicio</a>

<form [formGroup]="form" (ngSubmit)="registrar()" class="row g-3">
    <div class="col-md-4">
        <label>Nombre</label>
        <input type="text" [ngClass]="{'is-invalid': form.get('nombre')?.invalid && form.get('nombre')?.touched}" class="form-control" formControlName="nombre" />
        <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="invalid-feedback">Nombre es requerido.</div>
    </div>

    <div class="col-md-4">
        <label>DNI</label>
        <input type="text" [ngClass]="{'is-invalid': form.get('dni')?.invalid && form.get('dni')?.touched}" class="form-control" formControlName="dni"/>
                <div *ngIf="form.get('dni')?.errors && form.get('dni')?.touched" class="invalid-feedback">
                    <div *ngIf="form.get('dni')?.errors?.['required']">DNI es requerido.</div>
                    <div *ngIf="form.get('dni')?.errors?.['minlength']">DNI debe tener al menos 8 caracteres.</div>
                </div>
    </div>
    
    <div class="col-md-4">
        <label>Telefono</label>
        <input type="text" [ngClass]="{'is-invalid': form.get('telefono')?.invalid && form.get('telefono')?.touched}" class="form-control" formControlName="telefono"/>
        <div *ngIf="form.get('telefono')?.invalid && form.get('telefono')?.touched" class="invalid-feedback">Telefono es requerido.</div>
    </div>

    <button class="btn btn-primary mt-3" type="submit">Registrar</button>

</form>

<h4>Clientes Registrados</h4>
<ul class="list-group">
    <li *ngFor="let c of clientes" class="list-group-item">
        {{c.nombre}} - DNI: {{c.dni}} - Tel: {{c.telefono}}
    </li>
</ul>
