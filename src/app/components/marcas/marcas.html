<h3>Registro de Marcas</h3>
<a routerLink="/" class="btn btn-secondary mb-3">Volver al Inicio</a>

<form [formGroup]="form" (ngSubmit)="registrar()" class="row g-3 mb-3">
	<div class="col-md-6">
		<label>Nombre de la Marca</label>
		<input type="text" class="form-control" formControlName="nombre" [ngClass]="{'is-invalid': form.get('nombre')?.invalid && form.get('nombre')?.touched}" />
		<div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="invalid-feedback">Nombre es requerido.</div>
	</div>
	<div class="col-md-12">
		<button class="btn btn-primary mt-3" type="submit">Registrar Marca</button>
	</div>
</form>

<h4>Marcas Registradas</h4>
<ul class="list-group">
	<li *ngFor="let m of marcas" class="list-group-item">{{m.nombre}}</li>
</ul>
